[project]
name="Mood"
description="Multi-user dungeon, client-server"
version="0.1.0"
requires-python = ">=3.12"
dependencies = ["python-cowsay"]

[build-system]
requires = ["setuptools", "Sphinx", "build", "doit", "python-cowsay"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
mood="mood"

[tool.setuptools.package-data]
mood=["mood/locales/ru_RU/LC_MESSAGES/MUD.mo", "mood/_build/*", "mood/client/*.py", "mood/server/*.py"]

[project.scripts]
client = "mood.client.__main__:main"
server = "mood.server.__main__:run_server_finnaly"

[tool.setuptools.packages.find]
exclude = ["*__pycache__*"]


